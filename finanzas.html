<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finanzas - DexoneFit</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
        }

        header {
            background: #00a86b;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header button {
            margin-top: 15px;
            padding: 10px 20px;
            background: #ff6d00;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .contenedor {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .resumen {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .tarjeta {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }

        .tarjeta h3 {
            color: #666;
            margin-top: 0;
        }

        .valor {
            font-size: 25px;
            font-weight: bold;
            color: #00a86b;
        }

        .formulario {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .boton {
            margin-top: 20px;
            padding: 12px 22px;
            background: #ff6d00;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .boton:hover {
            background: #e65100;
        }

        .eliminar {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #00a86b;
            color: white;
        }

        .mensaje {
            margin-top: 15px;
            font-weight: bold;
            color: #00a86b;
        }

    </style>

</head>

<body>

<header>

    <h1>DEXONE FIT</h1>

    <p>Administración financiera</p>

    <button onclick="window.location.href='menu.html'">
        ← VOLVER AL MENÚ
    </button>

</header>


<div class="contenedor">


    <!-- RESUMEN -->

    <div class="resumen">

        <div class="tarjeta">

            <h3>💵 Ingresos</h3>

            <div class="valor" id="totalIngresos">
                $0
            </div>

        </div>


        <div class="tarjeta">

            <h3>💸 Gastos</h3>

            <div class="valor" id="totalGastos">
                $0
            </div>

        </div>


        <div class="tarjeta">

            <h3>📊 Balance</h3>

            <div class="valor" id="balance">
                $0
            </div>

        </div>

    </div>


    <!-- FORMULARIO -->

    <div class="tarjeta formulario">

        <h2>Registrar movimiento</h2>


        <label>Tipo de movimiento</label>

        <select id="tipo">

            <option value="">
                Seleccionar
            </option>

            <option value="Ingreso">
                Ingreso
            </option>

            <option value="Gasto">
                Gasto
            </option>

        </select>


        <label>Descripción</label>

        <input
            type="text"
            id="descripcion"
            placeholder="Ej: Mensualidad cliente"
        >


        <label>Valor</label>

        <input
            type="number"
            id="valor"
            placeholder="Ej: 150000"
        >


        <button
            class="boton"
            onclick="registrarMovimiento()">

            + REGISTRAR MOVIMIENTO

        </button>


        <div id="mensaje" class="mensaje"></div>

    </div>


    <!-- MOVIMIENTOS -->

    <div class="tarjeta">

        <h2>Movimientos registrados</h2>

        <table>

            <thead>

                <tr>

                    <th>Descripción</th>

                    <th>Tipo</th>

                    <th>Valor</th>

                    <th>Acción</th>

                </tr>

            </thead>


            <tbody id="tablaMovimientos">

            </tbody>

        </table>

    </div>

</div>


<script>

    let movimientos = JSON.parse(
        localStorage.getItem("movimientosDexoneFit")
    ) || [];


    // Registrar movimiento

    function registrarMovimiento() {

        const tipo =
            document.getElementById("tipo").value;

        const descripcion =
            document.getElementById("descripcion").value.trim();

        const valor =
            Number(document.getElementById("valor").value);


        if (!tipo || !descripcion || !valor || valor <= 0) {

            document.getElementById("mensaje").textContent =
                "⚠️ Completa correctamente todos los campos.";

            return;

        }


        const movimiento = {

            tipo: tipo,

            descripcion: descripcion,

            valor: valor

        };


        movimientos.push(movimiento);


        localStorage.setItem(
            "movimientosDexoneFit",
            JSON.stringify(movimientos)
        );


        document.getElementById("tipo").value = "";

        document.getElementById("descripcion").value = "";

        document.getElementById("valor").value = "";


        document.getElementById("mensaje").textContent =
            "✅ Movimiento registrado correctamente.";


        mostrarMovimientos();

        actualizarResumen();

    }


    // Mostrar movimientos

    function mostrarMovimientos() {

        const tabla =
            document.getElementById("tablaMovimientos");

        tabla.innerHTML = "";


        if (movimientos.length === 0) {

            tabla.innerHTML = `
                <tr>
                    <td colspan="4">
                        No hay movimientos registrados.
                    </td>
                </tr>
            `;

            return;

        }


        movimientos.forEach(function(movimiento, indice) {

            const fila =
                document.createElement("tr");


            fila.innerHTML = `

                <td>
                    ${movimiento.descripcion}
                </td>

                <td>
                    ${movimiento.tipo}
                </td>

                <td>
                    $${movimiento.valor.toLocaleString("es-CO")}
                </td>

                <td>

                    <button
                        class="eliminar"
                        onclick="eliminarMovimiento(${indice})">

                        Eliminar

                    </button>

                </td>

            `;


            tabla.appendChild(fila);

        });

    }


    // Actualizar ingresos, gastos y balance

    function actualizarResumen() {

        let ingresos = 0;

        let gastos = 0;


        movimientos.forEach(function(movimiento) {

            if (movimiento.tipo === "Ingreso") {

                ingresos += movimiento.valor;

            }


            if (movimiento.tipo === "Gasto") {

                gastos += movimiento.valor;

            }

        });


        const balance = ingresos - gastos;


        document.getElementById("totalIngresos").textContent =
            "$" + ingresos.toLocaleString("es-CO");


        document.getElementById("totalGastos").textContent =
            "$" + gastos.toLocaleString("es-CO");


        document.getElementById("balance").textContent =
            "$" + balance.toLocaleString("es-CO");

    }


    // Eliminar movimiento

    function eliminarMovimiento(indice) {

        movimientos.splice(indice, 1);


        localStorage.setItem(
            "movimientosDexoneFit",
            JSON.stringify(movimientos)
        );


        mostrarMovimientos();

        actualizarResumen();

    }


    // Cargar información al abrir

    mostrarMovimientos();

    actualizarResumen();

</script>

</body>

</html>
